name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm run test:ci
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Node.js Tests
          path: test-results.xml
          reporter: java-junit
