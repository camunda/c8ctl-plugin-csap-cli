name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Disable Windows Defender real-time monitoring
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install c8ctl CLI
        # Pinned to the version the c8ctl-cli.e2e.test.js integration test was
        # verified against; bump deliberately, not automatically.
        run: npm install -g @camunda8/cli@3.2.0
      - name: Run tests
        run: npm run test:ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: test-results.xml
          check_name: Node.js Tests (${{ matrix.os }})
